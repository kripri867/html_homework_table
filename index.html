<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Комірки</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <table class="styled-table">
      <!-- Рядок 1 -->
      <tr>
        <td></td>
        <td colspan="2">2</td>
        <td class="color-yellow" colspan="2"></td>
        <td class="size" rowspan="5"></td>
      </tr>
      <!-- Рядок 2 -->
      <tr>
        <td></td>
        <td class="color-red" colspan="2" rowspan="2"></td>
        <td class="color-yellow" colspan="2"></td>
      </tr>
      <!-- Рядок 3 -->
      <tr>
        <td rowspan="3"></td>
        <td>9</td>
        <td>10</td>
      </tr>
      <!-- Рядок 4 -->
      <tr>
        <td class="color-black" rowspan="3"></td>
        <td></td>
        <td colspan="2"></td>
      </tr>
      <!-- Рядок 5 -->
      <tr>
        <td>14</td>
        <td class="color-blue" colspan="2" rowspan="2"></td>
      </tr>
      <!-- Рядок 6 -->
      <tr>
        <td class="color-yellow" rowspan="2"></td>
        <td class="color-black"></td>
        <td class="color-red size" rowspan="2"></td>
      </tr>
      <!-- Рядок 7 -->
      <tr>
        <td>19</td>
        <td colspan="3"></td>
      </tr>
    </table>
  </div>
</body>

</html>
